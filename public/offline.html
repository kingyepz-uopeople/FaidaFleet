<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Offline · FaidaFleet</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: "PT Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #f1f5f9);
        color: #111827;
      }
      .card {
        width: 100%;
        max-width: 28rem;
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .brand-badge {
        display: inline-flex;
        padding: 0.5rem;
        border-radius: 0.75rem;
        background: #2563eb;
        color: #ffffff;
      }
      .brand-name { font-size: 1.5rem; font-weight: 700; }
      h1 { font-size: 1.375rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #4b5563; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        width: 100%;
        height: 3rem;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
      }
      button:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <main class="card">

      <h1>You&rsquo;re offline</h1>

        FaidaFleet can&rsquo;t reach the network right now. Check your internet

</html>
